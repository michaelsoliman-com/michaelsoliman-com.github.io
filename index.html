<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Michael Soliman | Site Online</title>
  <meta name="description" content="GitHub Pages test and landing page for Michael Soliman." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background gradient */
    body::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 36px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.14);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #86efac;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.6;
      }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .info-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.845rem;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .info-label {
      color: #64748b;
    }

    .info-value {
      color: #e2e8f0;
      font-weight: 500;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: #f8fafc;
      color: #0f172a;
      border: 1px solid #ffffff;
    }

    .btn-primary:hover {
      background: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      transform: translateY(-1px);
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8125rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="card">
      <div class="status-badge">
        <span class="status-dot"></span>
        GitHub Pages Active
      </div>

      <h1>michaelsoliman.com</h1>
      <p>This repository is connected and ready to serve GitHub Pages content.</p>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">Host:</span>
          <span class="info-value" id="current-host">GitHub Pages</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status:</span>
          <span class="info-value" style="color: var(--success);">200 OK</span>
        </div>
        <div class="info-row">
          <span class="info-label">Loaded at:</span>
          <span class="info-value" id="current-time">--:--:--</span>
        </div>
      </div>

      <div class="actions">
        <a href="https://github.com/michaelsoliman-com/michaelsoliman-com.github.io" target="_blank" rel="noopener noreferrer" class="btn btn-primary" id="view-repo-btn">
          View Repository
        </a>
        <button type="button" class="btn btn-secondary" id="refresh-btn" onclick="updateTime()">
          Ping Site
        </button>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> Michael Soliman. All rights reserved.
    </footer>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('current-time').textContent = timeStr;
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-host').textContent = window.location.hostname || 'localhost';
      document.getElementById('year').textContent = new Date().getFullYear();
      updateTime();
    });
  </script>
</body>
</html>
